# app-server publishes each OTLP request as a single message, so the broker's
# limit must exceed app-server's HTTP_PAYLOAD_LIMIT (50 MB in docker-compose.yml)
# plus serialization overhead. RabbitMQ's 16 MiB default makes it reject larger
# batches after app-server has already answered 200, silently dropping the spans.
max_message_size = 134217728
