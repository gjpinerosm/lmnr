# This compose file is a lightweight version of docker-compose-full.yml.
# It is intended to be used for local quickstarts.
# It includes frontend, clickhouse, postgres, quickwit, rabbitmq, and app-server.
# RabbitMQ gives app-server a durable span queue, so spans already acknowledged
# to the client survive an app-server restart (the in-memory queue drops them).

name: lmnr

services:
  rabbitmq:
    image: rabbitmq:4
    pull_policy: always
    # Fixed hostname: RabbitMQ stores data under its node name (rabbit@<hostname>),
    # so a random container hostname would orphan the volume on every recreate.
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - type: bind
        source: ./rabbitmq-lmnr.conf
        target: /etc/rabbitmq/conf.d/90-lmnr.conf
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms
      interval: 10s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    pull_policy: always
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:26.5
    container_name: clickhouse
    pull_policy: always
    volumes:
      - type: volume
        source: clickhouse-data
        target: /var/lib/clickhouse/
      - type: volume
        source: clickhouse-logs
        target: /var/log/clickhouse-server/
      - type: bind
        source: ./clickhouse-profiles-config.xml
        target: /etc/clickhouse-server/users.d/lmnr.xml
      - type: bind
        source: ./clickhouse-server-config.xml
        target: /etc/clickhouse-server/config.d/lmnr.xml
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  quickwit:
    image: quickwit/quickwit:v0.9.1
    pull_policy: always
    ports:
      - "7280:7280" # REST API and UI
      - "7281:7281" # OTLP / gRPC
    environment:
      QW_DATA_DIR: /quickwit/qwdata
    command: ["run"]
    volumes:
      - quickwit-data:/quickwit/qwdata
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7280 && printf 'GET /health/livez HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/lmnr-ai/frontend
    pull_policy: always
    ports:
      - "${FRONTEND_HOST_PORT:-5667}:5667"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      quickwit:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 5667
      BACKEND_URL: http://app-server:8000
      BACKEND_RT_URL: http://app-server:8002
      SHARED_SECRET_TOKEN: ${SHARED_SECRET_TOKEN}
      NEXTAUTH_URL: http://localhost:5667
      NEXTAUTH_SECRET: some_secret
      NEXT_PUBLIC_URL: http://localhost:5667
      ENVIRONMENT: LITE # this disables some runtime dependencies
      LAMINAR_TELEMETRY_DISABLED: "${LAMINAR_TELEMETRY_DISABLED:-false}"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_RO_USER: ${CLICKHOUSE_RO_USER}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD}
      # Host/port are from ClickHouse's perspective (the `postgres` service), not the host's localhost:5433.
      CLICKHOUSE_POSTGRES_HOST: postgres
      CLICKHOUSE_POSTGRES_PORT: "5432"
      CLICKHOUSE_POSTGRES_DATABASE: ${POSTGRES_DB}
      CLICKHOUSE_POSTGRES_USER: ${CLICKHOUSE_POSTGRES_USER:-}
      CLICKHOUSE_POSTGRES_PASSWORD: ${CLICKHOUSE_POSTGRES_PASSWORD:-}
      CLICKHOUSE_POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-public}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AEAD_SECRET_KEY: ${AEAD_SECRET_KEY}
      QUICKWIT_SEARCH_URL: http://quickwit:7280
      # LLM provider for frontend AI features (chat-with-trace, SQL-with-AI).
      # openai | gemini | bedrock | azure_chat_completions | azure_responses |
      # azure_anthropic. openai/gemini use LLM_API_KEY (+ optional LLM_BASE_URL);
      # bedrock uses AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION; the
      # azure_* providers share LLM_API_KEY + AZURE_RESOURCE_ID (or AZURE_BASE_URL)
      # and differ only in which API shape they talk to.
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      AZURE_RESOURCE_ID: ${AZURE_RESOURCE_ID}
      AZURE_BASE_URL: ${AZURE_BASE_URL}
      AZURE_API_VERSION: ${AZURE_API_VERSION}
      # LLM_MODEL_* overrides (optional — per-provider defaults apply when unset).
      LLM_MODEL_SMALL: ${LLM_MODEL_SMALL}
      LLM_MODEL_MEDIUM: ${LLM_MODEL_MEDIUM}
      LLM_MODEL_LARGE: ${LLM_MODEL_LARGE}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

  app-server:
    image: ghcr.io/lmnr-ai/app-server
    pull_policy: always
    ports:
      - "${APP_SERVER_HOST_PORT:-8000}:8000"
      - "${APP_SERVER_GRPC_HOST_PORT:-8001}:8001"
      - "${APP_SERVER_RT_HOST_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_started
      quickwit:
        condition: service_healthy
    environment:
      PORT: 8000
      NEXT_INTERNAL_URL: http://frontend:5667
      GRPC_PORT: 8001
      # 50 MB; the Claude Code plugin sends up to 16 MiB batches. Keep below max_message_size in rabbitmq-lmnr.conf.
      HTTP_PAYLOAD_LIMIT: ${HTTP_PAYLOAD_LIMIT:-52428800}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2f
      SHARED_SECRET_TOKEN: ${SHARED_SECRET_TOKEN}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_RO_USER: ${CLICKHOUSE_RO_USER}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD}
      ENVIRONMENT: FULL # with RABBITMQ_URL, uses RabbitMQ instead of the in-memory queue
      AEAD_SECRET_KEY: ${AEAD_SECRET_KEY}
      QUICKWIT_SEARCH_URL: http://quickwit:7280
      QUICKWIT_INGEST_URL: http://quickwit:7281
      QUICKWIT_SPANS_INDEX_ID: spans_v2

volumes:
  rabbitmq-data:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  quickwit-data:
