# Local overrides for the fork, merged automatically by `docker compose`.
# Delete this file to go back to the stock setup.
services:
  clickhouse:
    # Only for running `pnpm dev` on the host against this stack.
    ports:
      - "127.0.0.1:8123:8123"

  frontend:
    # The fork's own frontend (adds the Agent graph page). To go back to the
    # published image, remove these three keys and run `docker compose up -d frontend`.
    build:
      context: ./frontend
    image: lmnr-frontend:local
    pull_policy: build
    environment:
      # Optional LAN origin, e.g. http://192.168.5.101:5667 (see docs/fork/security-backlog.md SEC-4).
      BETTER_AUTH_TRUSTED_ORIGINS: ${LAN_TRUSTED_ORIGINS:-}
